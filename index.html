<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The European Goldfinch Society — Field Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F1E8D0;
    --paper-dark: #E3D6AE;
    --ink: #23201B;
    --ink-soft: #52493A;
    --gold: #C99A2E;
    --crimson: #A2352A;
    --forest: #3F4A34;
    --rule: rgba(35,32,27,0.25);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background: var(--paper);
    background-image:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.35), transparent 60%),
      repeating-linear-gradient(0deg, rgba(35,32,27,0.02) 0px, rgba(35,32,27,0.02) 1px, transparent 1px, transparent 3px);
    color: var(--ink);
    font-family: 'Special Elite', monospace;
    min-height: 100%;
    padding: 28px 20px 40px;
  }
  .masthead{ max-width: 760px; margin: 0 auto 18px; text-align: center; border-bottom: 3px double var(--ink); padding-bottom: 16px; }
  .masthead .bird{ width:54px; height:54px; margin:0 auto 6px; display:block; }
  .masthead h1{ font-family: 'IM Fell English', serif; font-style: italic; font-size: 28px; letter-spacing: 1px; margin: 0; }
  .masthead .sub{ font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--ink-soft); margin-top: 4px; }
  .masthead .rule2{ margin-top:10px; font-size:10px; letter-spacing:2px; color:var(--crimson); text-transform:uppercase; }

  .wrap{ max-width: 760px; margin: 0 auto; display:flex; flex-direction:column; gap:14px; }

  .setup{
    display:flex; gap:14px; flex-wrap:wrap; justify-content:center; align-items:flex-end;
    background: var(--paper-dark); border: 1px solid var(--rule); padding: 12px 14px;
  }
  .setup .field{ display:flex; flex-direction:column; gap:3px; }
  .setup label{ font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-soft); }
  .setup input{
    font-family:'Special Elite', monospace; background: var(--paper); border: 1px solid var(--rule);
    padding: 6px 8px; font-size: 13px; color: var(--ink); width: 170px;
  }
  .setup input:focus{ outline:none; border-color: var(--crimson); }
  .setup button{
    font-family:'IM Fell English', serif; font-style: italic; font-size: 14px;
    background: var(--ink); color: var(--paper); border:none; padding: 8px 16px; cursor:pointer;
  }
  .setup button:hover{ background: var(--crimson); }
  .setup .hint{ flex-basis:100%; font-size:10px; color: var(--ink-soft); text-align:center; }

  .log{
    background: var(--paper-dark); border: 1px solid var(--rule);
    box-shadow: inset 0 0 30px rgba(35,32,27,0.06);
    padding: 10px 6px; max-height: 420px; overflow-y: auto;
  }
  .empty-log{ text-align:center; padding: 30px 10px; color: var(--ink-soft); font-size: 13px; }

  .entry{ display:flex; gap:10px; align-items:flex-start; padding: 10px 10px; border-bottom: 1px dotted var(--rule); animation: settle .35s ease-out; }
  .entry:last-child{ border-bottom:none; }
  @keyframes settle{ from{ opacity:0; transform: translateY(6px); } to{ opacity:1; transform: translateY(0); } }

  .band{ flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--ink);
    display:flex; align-items:center; justify-content:center; font-size: 10px; font-weight:bold;
    color: var(--paper); background: var(--forest); }
  .band.mine{ background: var(--crimson); }

  .entry-body{ flex:1; min-width:0; }
  .entry-meta{ font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 2px; }
  .entry-meta .no{ color: var(--gold); }
  .entry-text{ font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }

  .composer{ display:flex; gap:8px; align-items:flex-end; border-top: 3px double var(--ink); padding-top: 12px; }
  .composer .field{ flex:1; display:flex; flex-direction:column; gap:4px; }
  .composer label{ font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-soft); }
  .composer textarea{
    font-family:'Special Elite', monospace; font-size: 14px; background: var(--paper);
    border: 1px solid var(--rule); padding: 8px 10px; resize: none; min-height: 42px; color: var(--ink);
  }
  .composer textarea:focus{ outline:none; border-color: var(--crimson); }
  .composer button{
    font-family:'IM Fell English', serif; font-style: italic; font-size: 16px;
    background: var(--ink); color: var(--paper); border: none; padding: 10px 18px; cursor: pointer;
  }
  .composer button:hover{ background: var(--crimson); }
  .composer button:disabled{ opacity:0.4; cursor:default; }

  .status-line{ text-align:center; font-size: 10px; color: var(--ink-soft); letter-spacing:1px; text-transform:uppercase; }
  .error-line{ text-align:center; font-size: 11px; color: var(--crimson); display:none; }

  @media (prefers-reduced-motion: reduce){ .entry{ animation:none; } }
</style>
</head>
<body>
  <div class="masthead">
    <svg class="bird" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="30" cy="38" rx="16" ry="11" fill="#23201B"/>
      <ellipse cx="30" cy="38" rx="10" ry="7" fill="#C99A2E"/>
      <circle cx="46" cy="26" r="9" fill="#23201B"/>
      <circle cx="49" cy="24" r="1.4" fill="#F1E8D0"/>
      <path d="M46 20 C42 16, 44 12, 49 10 C 47 15, 48 17, 50 19 Z" fill="#A2352A"/>
      <path d="M14 36 L2 30 L14 42 Z" fill="#3F4A34"/>
      <path d="M55 24 L64 20 L58 30 Z" fill="#23201B"/>
    </svg>
    <h1>The European Goldfinch Society</h1>
    <div class="sub">Migratory Correspondence &amp; Field Log</div>
    <div class="rule2">Messages stored permanently — nothing expires</div>
  </div>

  <div class="wrap">
    <div class="setup">
      <div class="field">
        <label>Observer callsign</label>
        <input id="gf-name" type="text" maxlength="18" placeholder="e.g. Jane" />
      </div>
      <div class="field">
        <label>Repo (owner/name)</label>
        <input id="gf-repo" type="text" maxlength="80" placeholder="e.g. janedoe/goldfinch-log" />
      </div>
      <div class="field">
        <label>Access token</label>
        <input id="gf-token" type="password" maxlength="120" placeholder="ghp_..." />
      </div>
      <button id="gf-connect">Tune in</button>
      <div class="hint">Both of you need the same repo name and the same token, entered once — it's saved on your own device only.</div>
    </div>

    <div class="log" id="gf-log">
      <div class="empty-log">Fill in the fields above and tune in to begin.</div>
    </div>

    <div class="composer">
      <div class="field">
        <label>Field notes</label>
        <textarea id="gf-text" maxlength="800" placeholder="Write your entry..." disabled></textarea>
      </div>
      <button id="gf-send" disabled>Log entry</button>
    </div>

    <div class="status-line" id="gf-status">not connected</div>
    <div class="error-line" id="gf-error"></div>
  </div>

<script>
(function(){
  const logEl = document.getElementById('gf-log');
  const nameEl = document.getElementById('gf-name');
  const repoEl = document.getElementById('gf-repo');
  const tokenEl = document.getElementById('gf-token');
  const connectBtn = document.getElementById('gf-connect');
  const textEl = document.getElementById('gf-text');
  const sendBtn = document.getElementById('gf-send');
  const statusEl = document.getElementById('gf-status');
  const errorEl = document.getElementById('gf-error');

  const DATA_FILE = 'messages.json';
  let entries = [];
  let currentSha = null;
  let repoFull = null;
  let token = null;
  let pollTimer = null;

  function showError(msg){ errorEl.textContent = msg; errorEl.style.display = 'block'; }
  function clearError(){ errorEl.style.display = 'none'; errorEl.textContent = ''; }

  function b64EncodeUnicode(str){
    return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,
      (match, p1) => String.fromCharCode('0x' + p1)));
  }
  function b64DecodeUnicode(str){
    return decodeURIComponent(atob(str.replace(/\n/g,'')).split('').map(c =>
      '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
  }

  function initials(name){
    if(!name) return '??';
    const parts = name.trim().split(/\s+/);
    if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }
  function fmtTime(ts){
    return new Date(ts).toLocaleString(undefined, { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render(){
    if(!entries.length){
      logEl.innerHTML = '<div class="empty-log">No sightings logged yet. Be the first to report in.</div>';
      return;
    }
    const myName = nameEl.value.trim().toLowerCase();
    logEl.innerHTML = entries.map((e, i) => {
      const mine = myName && e.name && e.name.toLowerCase() === myName;
      return `
        <div class="entry">
          <div class="band ${mine ? 'mine' : ''}">${initials(e.name)}</div>
          <div class="entry-body">
            <div class="entry-meta"><span class="no">Entry No. ${i+1}</span> — ${escapeHtml(e.name || 'Unknown')} — ${fmtTime(e.ts)}</div>
            <div class="entry-text">${escapeHtml(e.text)}</div>
          </div>
        </div>`;
    }).join('');
    logEl.scrollTop = logEl.scrollHeight;
  }

  function ghHeaders(){
    return {
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    };
  }

  async function fetchData(){
    const url = `https://api.github.com/repos/${repoFull}/contents/${DATA_FILE}`;
    const res = await fetch(url, { headers: ghHeaders() });
    if(res.status === 404){
      currentSha = null;
      entries = [];
      return;
    }
    if(!res.ok){
      if(res.status === 401 || res.status === 403) throw new Error('auth');
      throw new Error('fetch failed: ' + res.status);
    }
    const data = await res.json();
    currentSha = data.sha;
    try{
      entries = JSON.parse(b64DecodeUnicode(data.content));
    }catch(e){ entries = []; }
  }

  async function pushData(newEntries, retry){
    const url = `https://api.github.com/repos/${repoFull}/contents/${DATA_FILE}`;
    const body = {
      message: 'New field log entry',
      content: b64EncodeUnicode(JSON.stringify(newEntries, null, 2))
    };
    if(currentSha) body.sha = currentSha;
    const res = await fetch(url, {
      method: 'PUT',
      headers: { ...ghHeaders(), 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if(res.status === 409 && !retry){
      // someone else updated first — refetch and retry once
      await fetchData();
      newEntries = entries.concat(newEntries.slice(entries.length));
      return pushData(newEntries, true);
    }
    if(!res.ok){
      if(res.status === 401 || res.status === 403) throw new Error('auth');
      throw new Error('push failed: ' + res.status);
    }
    const data = await res.json();
    currentSha = data.content.sha;
    entries = newEntries;
  }

  async function poll(){
    try{
      await fetchData();
      render();
      statusEl.textContent = `tuned to "${repoFull}" — last synced ${new Date().toLocaleTimeString()}`;
    }catch(e){
      if(e.message === 'auth'){
        showError('Access token rejected — check it has permission for this repo.');
        stopPolling();
      }
    }
  }

  function stopPolling(){
    if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
    textEl.disabled = true; sendBtn.disabled = true;
  }

  async function tuneIn(){
    clearError();
    const repo = repoEl.value.trim().replace(/^\/|\/$/g, '');
    const tok = tokenEl.value.trim();
    if(!repo || !repo.includes('/')){ showError('Enter the repo as owner/name, e.g. janedoe/goldfinch-log.'); repoEl.focus(); return; }
    if(!tok){ showError('Enter the access token.'); tokenEl.focus(); return; }

    repoFull = repo;
    token = tok;
    statusEl.textContent = `tuning to "${repoFull}"...`;
    try{
      await fetchData();
      render();
      textEl.disabled = false; sendBtn.disabled = false;
      statusEl.textContent = `tuned to "${repoFull}" — last synced ${new Date().toLocaleTimeString()}`;
      localStorage.setItem('goldfinch-repo', repoEl.value);
      localStorage.setItem('goldfinch-token', tok);
      localStorage.setItem('goldfinch-name', nameEl.value.trim());
      if(pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(poll, 15000);
    }catch(e){
      if(e.message === 'auth'){
        showError('Access token rejected — check the token and repo name.');
      }else{
        showError('Could not connect. Check your internet connection and try again.');
      }
      statusEl.textContent = 'not connected';
    }
  }

  async function sendEntry(){
    clearError();
    if(!repoFull){ showError('Tune in first.'); return; }
    const name = nameEl.value.trim();
    const text = textEl.value.trim();
    if(!name){ showError('Enter your observer callsign first.'); nameEl.focus(); return; }
    if(!text){ showError('Write a message before logging it.'); textEl.focus(); return; }

    sendBtn.disabled = true;
    try{
      await fetchData(); // get latest before appending
      const newEntries = entries.concat([{ name, text, ts: Date.now() }]);
      await pushData(newEntries, false);
      render();
      textEl.value = '';
      localStorage.setItem('goldfinch-name', name);
      statusEl.textContent = `tuned to "${repoFull}" — last synced ${new Date().toLocaleTimeString()}`;
    }catch(e){
      if(e.message === 'auth'){
        showError('Access token rejected — check it has write permission for this repo.');
      }else{
        showError('Could not send — check your connection and try again.');
      }
    }
    sendBtn.disabled = false;
  }

  connectBtn.addEventListener('click', tuneIn);
  sendBtn.addEventListener('click', sendEntry);
  textEl.addEventListener('keydown', (ev) => {
    if(ev.key === 'Enter' && !ev.shiftKey){ ev.preventDefault(); sendEntry(); }
  });

  const savedName = localStorage.getItem('goldfinch-name');
  const savedRepo = localStorage.getItem('goldfinch-repo');
  const savedToken = localStorage.getItem('goldfinch-token');
  if(savedName) nameEl.value = savedName;
  if(savedRepo) repoEl.value = savedRepo;
  if(savedToken) tokenEl.value = savedToken;
  if(savedRepo && savedToken) tuneIn();
})();
</script>
</body>
</html>
